# Copie para k8s/secret.yaml (ignorado no git), preencha e aplique: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: oficina-os-service-secrets
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=<railway-proxy-host>;Port=<porta>;Database=oficina_os;Username=postgres;Password=<senha>;SSL Mode=Require;Trust Server Certificate=true"
  Jwt__Secret: "<jwt-secret-min-32-chars>"
  NEW_RELIC_LICENSE_KEY: "<license-key>"
