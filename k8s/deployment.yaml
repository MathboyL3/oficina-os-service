apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-os-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-os-service
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-os-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-os-service
    app.kubernetes.io/part-of: oficina
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/mathboyl3/oficina-os-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-os-service-config
            - secretRef:
                name: oficina-os-service-secrets
          env:
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RabbitMq__Password
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"