services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
  os-db:
    image: postgres:16
    container_name: os-db
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_os
    ports:
      - "5435:5432"
    volumes:
      - os-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  os-api:
    build: .
    image: oficina-os-service:local
    container_name: os-api
    depends_on:
      os-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      ConnectionStrings__Postgres: Host=os-db;Port=5432;Database=oficina_os;Username=oficina;Password=oficina
      Catalogo__BaseUrl: http://execucao-api:8080
      InternalApi__ServiceKey: dev-service-key-trocar-em-producao-0123456789
    ports:
      - "5001:8080"

volumes:
  os-db-data:

networks:
  default:
    name: oficina-dev
    external: true
